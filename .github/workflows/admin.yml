#---------------------------For Prod----------------------------------
name: PROD Super-Admin - CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin.yml"

concurrency:
  group: aestelyx-prod-admin-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # ==================== JOB 1: BUILD AND PUSH TO ECR ====================
  build-and-push:
    name: Build and Push Super Admin Image
    runs-on: ubuntu-latest
    environment: PROD
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: aestelyx-prod-admin

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch Build-time Secrets from SSM Parameter Store
        id: ssm-params
        run: |
          set -euo pipefail
          NEXT_PUBLIC_API_URL=$(aws ssm get-parameter --name "/api/NEXT_PUBLIC_API_URL" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "${{ secrets.NEXT_PUBLIC_API_URL || '' }}")
          FRONTEND_API_BASE_URL=$(aws ssm get-parameter --name "/api/FRONTEND_API_BASE_URL" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "${{ secrets.FRONTEND_API_BASE_URL || '' }}")
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> "$GITHUB_ENV"
          echo "FRONTEND_API_BASE_URL=${FRONTEND_API_BASE_URL}" >> "$GITHUB_ENV"
      - name: Define Image Tag
        id: image
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and Push Super Admin Image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ADMIN_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "❌ ERROR: ADMIN_ECR_REPOSITORY secret is missing."
            exit 1
          fi
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build \
            --no-cache \
            --file apps/admin/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg FRONTEND_API_BASE_URL="$FRONTEND_API_BASE_URL" \
            --tag "${FULL_IMAGE}:${IMAGE_TAG}" \
            --tag "${FULL_IMAGE}:latest" \
            .
          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          docker push "${FULL_IMAGE}:latest"
          echo "✅ Pushed image: ${FULL_IMAGE}:${IMAGE_TAG}"
  # ==================== JOB 2: DEPLOY VIA AWS SSM ====================
  deploy:
    name: Deploy Super Admin to PROD EC2 via AWS SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: PROD
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: aestelyx-prod-admin
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: aestelyx-prod-admin-deploy

      - name: Execute Deployment on EC2 via SSM Run Command
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ secrets.PROD_EC2_INSTANCE_ID }}"
          AWS_REGION="${{ secrets.AWS_REGION }}"
          REPO_NAME=$(aws ssm get-parameter --name "/api/ADMIN_ECR_REPOSITORY" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "${{ secrets.ADMIN_ECR_REPOSITORY || 'prod-admin' }}")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPO="${ECR_REGISTRY}/${REPO_NAME}"
          REMOTE_SCRIPT=$(cat << EOF | base64 -w 0
          set -e
          echo "=== Starting Super Admin Deployment ==="
          export PATH=\$PATH:/usr/local/bin:/usr/bin:/bin
          aws ecr get-login-password --region ${AWS_REGION} | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
          
          if ! sudo docker pull "${ECR_REPO}:latest"; then
            sudo docker builder prune -f || true
            sudo docker pull "${ECR_REPO}:latest"
          fi
          sudo docker network inspect aestelyx-prod-net >/dev/null 2>&1 || sudo docker network create aestelyx-prod-net
          mkdir -p /etc/aestelyx
          RAW_ENV="/tmp/admin_raw.env"
          FINAL_ENV="/etc/aestelyx/admin.env"
          aws ssm get-parameters-by-path --path "/api/" --recursive --with-decryption --region ${AWS_REGION} --query "Parameters[*].[Name,Value]" --output text | awk '{split(\$1, a, "/"); param_name = a[length(a)]; \$1=""; sub(/^ /, ""); print param_name "=" \$0}' > "\$RAW_ENV"
          # Extract Service Specific Variables
          {
            grep -E '^(NEXT_PUBLIC_API_URL|FRONTEND_API_BASE_URL)=' "\$RAW_ENV" || true
            echo "PORT=3103"
            echo "NODE_ENV=production"
          } > "\$FINAL_ENV"
          sudo docker stop prod-admin-portal || true
          sudo docker rm prod-admin-portal || true
          sudo docker run -d \
            --name prod-admin-portal \
            --network aestelyx-prod-net \
            -p 3103:3103 \
            --restart always \
            --env-file "\$FINAL_ENV" \
            -e NODE_ENV=production \
            -e PORT=3103 \
            "${ECR_REPO}:latest"
          sleep 5
          HEALTHY=false
          for attempt in \$(seq 1 30); do
            HTTP_STATUS=\$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3103/ || echo "000")
            case "\$HTTP_STATUS" in 2??|3??) HEALTHY=true; echo "✅ Health check passed: HTTP \$HTTP_STATUS"; break ;; esac
            sleep 2
          done
          if [ "\$HEALTHY" != "true" ]; then
            echo "❌ Deployment failed!"
            sudo docker logs --tail 100 prod-admin-portal || true
            exit 1
          fi
          sudo docker image prune -f || true
          echo "=== Super Admin Deployment Complete ==="
          EOF
          )
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --parameters "commands=[\"echo $REMOTE_SCRIPT | base64 -d | bash\"]" --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"



